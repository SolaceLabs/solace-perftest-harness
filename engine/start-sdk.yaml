---
- hosts: subhost, pubhost
  remote_user: "{{ sshuser }}"
  vars_files:
    - ../config/credentials.yaml
  vars:
    ansible_port: "{{ ssh_port | default(22) }}"
    #main setup variables - can be overriden by calling script
    # sshuser is loaded from config/credentials.yaml (written by setup.sh); default: perfharness
    script_path: '/home/{{ sshuser }}/pubSubTools'

    #variables controlling the test type - most of these are being overwritten by calling scripts
    runlength: 120 #default run length for each test
    mt: persistent #default message type: direct, nonpersistent or persistent
    msg_size: 1024 # default message payload size
    #how many individual consumers on each topic:
    sdk_fanout: 1 #default fanout number
    sdk_fanout_calc: "{{ [sdk_fanout, 1] | max }}" #for calculations avoiding div by zero
    #how many hosts to run publishers and subscribers on:
    parallel_hosts: 1 #default publisher and consumer hosts
    #set the overall target msg rate you want to achieve (incl fanout):
    target_msg_rate: 0 #default message rate to achieve
    #more or less constant and calculated values...
    sdk_consumer_threads: 1 #default=1, increase, if you need some load balancing

    ##section for calculating values based on input variables ##
    HOST_COUNT: "{{ parallel_hosts }}"
    HOST_COUNT_calc: "{{ [HOST_COUNT, 1] | max }}" #for calculations avoiding div by zero
    msg_rate: "{{ (target_msg_rate / (HOST_COUNT_calc | int) / (sdk_fanout_calc | int)) | int }}" # rate per publisher host
    #set sdk_publishers equal to the number of cores on the test hosts:
    sdk_publishers: "{{ pub_cores | default(4) | int }}" # loaded from config/credentials.yaml
    #set actual number of publishers to the lower of the two for really small msg rates:
    act_publishers: "{{ [[ msg_rate | int, sdk_publishers | int] | min, 1] | max }}"
    sdk_consumers: "{{ act_publishers }}" #default number of clients on each consumer hosts - needs to match publishers!
    sdk_credentials: "-cu={{ broker_username | trim }}@{{ broker_vpn | trim }} -cp={{ broker_password | trim }}"
    # Mesh mode support: use pub_broker/sub_broker if defined, else fall back to broker
    pub_broker_resolved: "{{ pub_broker | default(broker | default('')) }}"
    sub_broker_resolved: "{{ sub_broker | default(broker | default('')) }}"
    # Protocol selection: smf (default), mqtt, amqp
    # Use distinct computed names to avoid self-referential Ansible variable loops
    _protocol:  "{{ broker_protocol     | default('smf') }}"
    _pub_proto: "{{ pub_broker_protocol | default(_protocol) }}"
    _sub_proto: "{{ sub_broker_protocol | default(_protocol) }}"
    # sdkperf binary filename on test host (dest); Java tools use .sh wrapper
    _pub_sdkperf_binary: "{{ 'sdkperf_mqtt.sh' if _pub_proto == 'mqtt' else 'sdkperf_jmsamqp.sh' if _pub_proto == 'amqp' else 'sdkperf_c' }}"
    _sub_sdkperf_binary: "{{ 'sdkperf_mqtt.sh' if _sub_proto == 'mqtt' else 'sdkperf_jmsamqp.sh' if _sub_proto == 'amqp' else 'sdkperf_c' }}"
    # TLS flags per side
    _broker_tls: "{{ broker_tls | default(false) | bool }}"
    _pub_tls: "{{ pub_broker_tls | default(broker_tls | default(false)) | bool }}"
    _sub_tls: "{{ sub_broker_tls | default(broker_tls | default(false)) | bool }}"
    # Port suffix helpers — use explicit override if set, else protocol-aware default
    _broker_port_sfx: >-
      {{ ':' + (broker_port | string) if broker_port is defined and broker_port
         else ':8883' if _broker_tls and _protocol == 'mqtt'
         else ':1883' if _protocol == 'mqtt'
         else ':5671' if _broker_tls and _protocol == 'amqp'
         else ':5672' if _protocol == 'amqp'
         else ':55443' if _broker_tls
         else '' }}
    _pub_port: "{{ pub_broker_port if pub_broker_port is defined and pub_broker_port else broker_port if broker_port is defined and broker_port else '' }}"
    _pub_broker_port_sfx: >-
      {{ ':' + (_pub_port | string) if _pub_port
         else ':8883' if _pub_tls and _pub_proto == 'mqtt'
         else ':1883' if _pub_proto == 'mqtt'
         else ':5671' if _pub_tls and _pub_proto == 'amqp'
         else ':5672' if _pub_proto == 'amqp'
         else ':55443' if _pub_tls
         else '' }}
    _sub_port: "{{ sub_broker_port if sub_broker_port is defined and sub_broker_port else broker_port if broker_port is defined and broker_port else '' }}"
    _sub_broker_port_sfx: >-
      {{ ':' + (_sub_port | string) if _sub_port
         else ':8883' if _sub_tls and _sub_proto == 'mqtt'
         else ':1883' if _sub_proto == 'mqtt'
         else ':5671' if _sub_tls and _sub_proto == 'amqp'
         else ':5672' if _sub_proto == 'amqp'
         else ':55443' if _sub_tls
         else '' }}
    # URL scheme per protocol and TLS flag
    _broker_scheme: >-
      {{ 'mqtts' if _broker_tls and _protocol == 'mqtt'
         else 'amqps' if _broker_tls and _protocol == 'amqp'
         else 'tcps'  if _broker_tls
         else 'amqp'  if _protocol == 'amqp'
         else 'tcp' }}
    _pub_scheme: >-
      {{ 'mqtts' if _pub_tls and _pub_proto == 'mqtt'
         else 'amqps' if _pub_tls and _pub_proto == 'amqp'
         else 'tcps'  if _pub_tls
         else 'amqp'  if _pub_proto == 'amqp'
         else 'tcp' }}
    _sub_scheme: >-
      {{ 'mqtts' if _sub_tls and _sub_proto == 'mqtt'
         else 'amqps' if _sub_tls and _sub_proto == 'amqp'
         else 'tcps'  if _sub_tls
         else 'amqp'  if _sub_proto == 'amqp'
         else 'tcp' }}
    broker_cip: "{{ _broker_scheme + '://' + (broker | default('')) + _broker_port_sfx }}"
    pub_broker_cip: "{{ _pub_scheme + '://' + pub_broker_resolved + _pub_broker_port_sfx }}"
    sub_broker_cip: "{{ _sub_scheme + '://' + sub_broker_resolved + _sub_broker_port_sfx }}"
    pub_sdk_credentials: "-cu={{ pub_broker_username | default(broker_username) | trim }}@{{ pub_broker_vpn | default(broker_vpn) | trim }} -cp={{ pub_broker_password | default(broker_password) | trim }}"
    sub_sdk_credentials: "-cu={{ sub_broker_username | default(broker_username) | trim }}@{{ sub_broker_vpn | default(broker_vpn) | trim }} -cp={{ sub_broker_password | default(broker_password) | trim }}"
    # Protocol-aware message-type flags
    _mqtt_qos: "{{ mt | regex_replace('^qos', '') if mt is match('^qos[012]$') else '0' }}"
    _pub_mt_flags: "{{ '-mpq=' + _mqtt_qos if _pub_proto == 'mqtt' else '-mt=' + mt }}"
    _sub_mt_flags: "{{ '-msq=' + _mqtt_qos if _sub_proto == 'mqtt' else '-mt=' + mt }}"
    async_retries: "{{ runlength / 10 + 5 | round | int }}" #how long ansible is waiting for the sdks to finish (in 10s intervals).

    # some variables for pretty printing variables/test parameters
    filler: "            "
    str_msg_size: "{{ ([filler, msg_size] |join)[-8:] }}"
    str_overall_rate: "{{ ([filler, target_msg_rate] | join)[-8:] }}"
    str_msg_rate: "{{ ([filler, msg_rate] | join)[-8:] }}"
    str_mt: "{{ ([filler, mt] | join)[-13:] }}"
    str_fanout: "{{ ([filler, sdk_fanout] | join)[-8:] }}"
    str_parallel_hosts: "{{ ([filler, parallel_hosts] | join)[-8:] }}"
    str_publishers: "{{ ([filler, act_publishers] | join)[-8:] }}"
    str_pub_cores: "{{ ([filler, pub_cores | default(4)] | join)[-8:] }}"
    str_sub_cores: "{{ ([filler, sub_cores | default(4)] | join)[-8:] }}"

  ######################
  ######## MAIN ########
  ######################
  tasks:
  - name: 'check credentials'
    assert:
      that:
        - broker_username is defined
        - broker_vpn is defined
        - broker_password is defined
      fail_msg: >
        Broker credentials are missing from config/credentials.yaml.
        Run ./setup.sh to add them, or copy config/credentials.yaml.example
        and fill in broker_vpn, broker_username and broker_password.
    run_once: true
    tags: always

  - name: 'echo_start'
    debug:
      msg:
        - "#############################################"
        - "# Target message rate              {{ str_overall_rate }} #"
        - "# Message rate per publisher host  {{ str_msg_rate }} #"
        - "# Fanout                           {{ str_fanout }} #"
        - "# Message size                     {{ str_msg_size }} #"
        - "# Message type                {{ str_mt }} #"
        - "# Parallel hosts (pub/sub)         {{ str_parallel_hosts }} #"
        - "# Parallel processes per host      {{ str_publishers }} #"
        - "# Publisher host cores             {{ str_pub_cores }} #"
        - "# Subscriber host cores            {{ str_sub_cores }} #"
        - "#############################################"
    run_once: true
    tags: debug
  - name: 'create pubSubTools'
    file:
      path: "/home/{{ sshuser }}/pubSubTools"
      state: directory
      mode: 0755
  # SMF: copy single binary. New layout: pubSubTools/smf/sdkperf_c; legacy: pubSubTools/sdkperf_c.
  # The stat runs on localhost (the controller) once per host so each host has _smf_binary_stat.
  - name: 'detect SMF binary path (pubSubTools/smf/ vs legacy pubSubTools/)'
    stat:
      path: "{{ playbook_dir }}/../pubSubTools/smf/sdkperf_c"
    register: _smf_binary_stat
    delegate_to: localhost
  - name: 'copy SMF binary to pubhost'
    copy:
      src: "{{ '../pubSubTools/smf/sdkperf_c' if _smf_binary_stat.stat.exists else '../pubSubTools/sdkperf_c' }}"
      dest: "{{ script_path }}/sdkperf_c"
      owner: "{{ sshuser }}"
      group: "{{ sshuser }}"
      mode: "u+x"
    when: "'pubhost' in group_names and _pub_proto == 'smf'"
  - name: 'copy SMF binary to subhost'
    copy:
      src: "{{ '../pubSubTools/smf/sdkperf_c' if _smf_binary_stat.stat.exists else '../pubSubTools/sdkperf_c' }}"
      dest: "{{ script_path }}/sdkperf_c"
      owner: "{{ sshuser }}"
      group: "{{ sshuser }}"
      mode: "u+x"
    when: "'subhost' in group_names and _sub_proto == 'smf'"
  # MQTT: copy whole package directory (script + lib/ + lib/optional/ + licenses.txt)
  # Both pub and sub get the same package; lib/ must sit alongside the wrapper script.
  - name: 'copy MQTT package to pubhost'
    copy:
      src: ../pubSubTools/mqtt/
      dest: "{{ script_path }}/"
      owner: "{{ sshuser }}"
      group: "{{ sshuser }}"
    when: "'pubhost' in group_names and _pub_proto == 'mqtt'"
  - name: 'chmod MQTT wrapper on pubhost'
    file:
      path: "{{ script_path }}/sdkperf_mqtt.sh"
      mode: "u+x"
    when: "'pubhost' in group_names and _pub_proto == 'mqtt'"
  - name: 'copy MQTT package to subhost'
    copy:
      src: ../pubSubTools/mqtt/
      dest: "{{ script_path }}/"
      owner: "{{ sshuser }}"
      group: "{{ sshuser }}"
    when: "'subhost' in group_names and _sub_proto == 'mqtt'"
  - name: 'chmod MQTT wrapper on subhost'
    file:
      path: "{{ script_path }}/sdkperf_mqtt.sh"
      mode: "u+x"
    when: "'subhost' in group_names and _sub_proto == 'mqtt'"
  # AMQP: copy amqp/ dir first (includes wrapper, jaas/, and its own small lib/ subset),
  # then copy mqtt/lib/ on top to add the bulk of the required JARs (sol-sdkperf,
  # qpid-jms-client, proton-j, netty, etc.) which are not present in amqp/lib/.
  - name: 'copy AMQP package to pubhost'
    copy:
      src: ../pubSubTools/amqp/
      dest: "{{ script_path }}/"
      owner: "{{ sshuser }}"
      group: "{{ sshuser }}"
    when: "'pubhost' in group_names and _pub_proto == 'amqp'"
  - name: 'chmod AMQP wrapper on pubhost'
    file:
      path: "{{ script_path }}/sdkperf_jmsamqp.sh"
      mode: "u+x"
    when: "'pubhost' in group_names and _pub_proto == 'amqp'"
  - name: 'copy AMQP shared lib to pubhost'
    copy:
      src: ../pubSubTools/mqtt/lib/
      dest: "{{ script_path }}/lib/"
      owner: "{{ sshuser }}"
      group: "{{ sshuser }}"
    when: "'pubhost' in group_names and _pub_proto == 'amqp'"
  - name: 'copy AMQP package to subhost'
    copy:
      src: ../pubSubTools/amqp/
      dest: "{{ script_path }}/"
      owner: "{{ sshuser }}"
      group: "{{ sshuser }}"
    when: "'subhost' in group_names and _sub_proto == 'amqp'"
  - name: 'chmod AMQP wrapper on subhost'
    file:
      path: "{{ script_path }}/sdkperf_jmsamqp.sh"
      mode: "u+x"
    when: "'subhost' in group_names and _sub_proto == 'amqp'"
  - name: 'copy AMQP shared lib to subhost'
    copy:
      src: ../pubSubTools/mqtt/lib/
      dest: "{{ script_path }}/lib/"
      owner: "{{ sshuser }}"
      group: "{{ sshuser }}"
    when: "'subhost' in group_names and _sub_proto == 'amqp'"
  - name: 'copy scripts'
    copy:
      src: ../scripts/{{ item.src }}
      dest: "{{ script_path }}/{{ item.dest }}"
      owner: "{{ sshuser }}"
      group: "{{ sshuser }}"
      mode: "u+x"
    with_items:
      - { src: sdkpublisher.sh, dest: sdkpublisher.sh }
      - { src: sdkconsumers.sh, dest: sdkconsumers.sh }
  - name: 'run consumer'
    shell:  "NO_CORES={{ sub_cores | default(4) }} SDKPERF_BINARY={{ _sub_sdkperf_binary }} PROTOCOL={{ _sub_proto }} {{ script_path }}/sdkconsumers.sh {{ runlength + 10 }} {{ sdk_consumers }} {{ item.topic }} {{ sdk_fanout }} -cip={{ sub_broker_cip }} {{ sub_sdk_credentials }} -cc={{ sdk_consumer_threads }} {{ _sub_mt_flags }} | tee sdk.log"
    when: "item.groups in group_names and
    ( item.index|int <= parallel_hosts )"
    async: "{{ runlength + 20 }}"
    poll: 0
    args:
      chdir: "{{ script_path }}/"
      executable: "/bin/bash"
    register: "sub"
    with_items:
      - { index: 1, topic: 'topic1', groups: 'subhost' }
  - name: 'run publishers'
    shell:  "NO_CORES={{ pub_cores | default(4) }} SDKPERF_BINARY={{ _pub_sdkperf_binary }} PROTOCOL={{ _pub_proto }} {{ script_path }}/sdkpublisher.sh {{ runlength }} {{ msg_rate }} {{ act_publishers }} 999999999 {{ item.topic }} -cip={{ pub_broker_cip }} {{ pub_sdk_credentials }} -msa={{ msg_size }} {{ _pub_mt_flags }} | tee sdk.log"
    when: "item.groups in group_names and
    ( item.index|int <= parallel_hosts )"
    async: "{{ runlength + 30 }}"
    poll: 10
    args:
      chdir: "{{ script_path }}/"
      executable: "/bin/bash"
    register: "pub"
    with_items:
      - { index: 1, topic: 'topic1', groups: 'pubhost' }

  - name: 'check publishers'
    async_status:
      jid: "{{ item.ansible_job_id }}"
    ignore_errors: True
    register: "pub_result"
    until: pub_result.finished
    retries: "{{ async_retries | int }}"
    delay: 10
    failed_when: pub_result.rc is defined and pub_result.rc != 0
    when: not item is skipped
    with_items: "{{ pub.results }}"

  - name: 'display pub results'
    debug:
      msg: "{{ item.stdout_lines | default([item.stdout | default('(no output)')]) | reject('match', 'sdkperf_c ') | list }}"
    loop: "{{ pub.results }}"
    when: not item is skipped

  - name: 'check consumers'
    async_status:
      jid: "{{ item.ansible_job_id }}"
    ignore_errors: True
    register: "sub_result"
    until: sub_result.finished
    retries: "{{ async_retries | int }}"
    delay: 10
    when: not item is skipped
    with_items: "{{ sub.results }}"
  - name: 'display sub results'
    debug:
      msg: "{{ item.stdout_lines | default([item.stdout | default('(no output)')]) | reject('match', 'fanout:') | list }}"
    loop: "{{ sub_result.results }}"
    when: not item is skipped

  - name: 'echo_end'
    debug:
      msg:
        - "#############################################"
        - "# Target message rate              {{ str_overall_rate }} #"
        - "# Message rate per publisher host  {{ str_msg_rate }} #"
        - "# Fanout                           {{ str_fanout }} #"
        - "# Message size                     {{ str_msg_size }} #"
        - "# Message type                {{ str_mt }} #"
        - "# Parallel hosts (pub/sub)         {{ str_parallel_hosts }} #"
        - "# Parallel processes per host      {{ str_publishers }} #"
        - "# Publisher host cores             {{ str_pub_cores }} #"
        - "# Subscriber host cores            {{ str_sub_cores }} #"
        - "#############################################"
    run_once: true
